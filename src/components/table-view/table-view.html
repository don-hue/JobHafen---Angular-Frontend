<p-table [value]="jobs" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template #header>
        <tr>
            <th>Product</th>              
        </tr>
    </ng-template>
    <ng-template #body let-job>
        <tr>
            <td>
                <div class="flex items-center gap-3">
    
                    <div class="flex flex-col">
                        <span class="font-medium">{{ job.jobTitle }}</span>
                        <span class="text-xs text-surface-500 dark:text-surface-400">{{ job.companyName }}</span>
                    </div>
                </div>
            </td>
        </tr>
    </ng-template>
</p-table>

<p-table [value]="jobs" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template #header>
        <tr>
            <th>Product</th>              
        </tr>
    </ng-template>
    <ng-template #body let-job>
        <tr>
            <td>
                <div class="flex items-center gap-3">
    
                    <div class="flex flex-col">
                        <span class="font-medium">{{ job.jobTitle }}</span>
                        <span class="text-xs text-surface-500 dark:text-surface-400">{{ job.companyName }}</span>
                    </div>
                </div>
            </td>
        </tr>
    </ng-template>
</p-table>
    <div class="flex flex-col items-center gap-4">
            <div class="flex flex-wrap gap-4 justify-center">
                <button (click)="send()" pButton class="flex-col"><svg data-p-icon="search"></svg> Search</button>
            </div>

           @if (response) {
                <div>
                    {{ response.message }}
                </div>
            }
            @else {
                <div>
                    Loading...
                </div>
            }

     </div>

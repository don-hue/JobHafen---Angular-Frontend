<p-toast/>
<div class="flex justify-center h-full">
    <form [formGroup]="searchForm" 
    (ngSubmit)="onSubmit()" 
    class="flex flex-col gap-4 w-full sm:w-56">
        <div class="flex flex-col" style="padding-bottom: 1rem;">
            <input pInputText type="text" id="td_jobTitle" placeholder="Jobtitel" formControlName="jobTitle" [invalid]="isInvalid('jobTitle')" />
             @if (isInvalid('jobTitle')) {
                <p-message severity="error" size="small" variant="simple">Jobtitel notwendig</p-message>
            }
        </div>
        <div class="flex flex-col gap-1" style="padding-bottom: 1rem;">
            <input pInputText type="text" id="td_plz" name="plz" placeholder="Postleitzahl"  formControlName="postalcode" [invalid]="isInvalid('postalcode')" />
           @if (isInvalid('postalcode')) {
                    <p-message severity="error" size="small" variant="simple">Bitte gib eine gültige Postleitzahl an</p-message>
            }
        </div>
         <div class="flex justify-center" style="padding-bottom: 1rem;">
            <p-select [options]="radius" formControlName="radius" optionLabel="label" optionValue="value" placeholder="Select a radius" [invalid]="isInvalid('radius')" class="w-full md:w-56" />
        </div>
        <button pButton class="mt-auto" severity="secondary" type="submit">
            @if(isLoading) {
                <p-progress-spinner
                    ariaLabel="loading"
                    [style]="{ width: '1rem', height: '1rem' }"
                />
            } @else {
                Speichern
            }
        </button>
    </form>
</div>

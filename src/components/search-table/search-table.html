<p-table [value]="searches" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template #header>
        <tr>
            <th>
                Suchaufträge
                <button pButton class="flex-col"><svg data-p-icon="replay"></svg></button>
            </th>              
        </tr>
    </ng-template>
    <ng-template #body let-job>
        <tr>
            <td>
                <div class="flex items-center gap-3">
                    <div class="flex flex-col">
                        <span class="font-medium">{{ job.jobTitle }}</span>
                        <span class="text-xs text-surface-500 dark:text-surface-400">{{ job.companyName }}</span>
                    </div>
                </div>
            </td>
        </tr>
    </ng-template>
</p-table>
    <div class="flex flex-col items-left ">
            <div class="flex flex-wrap p-4">
                <button (click)="show()" pButton class="flex-wrap">
                    <svg data-p-icon="plus-circle"></svg> 
                    Suche anlegen
                </button>
            </div>

     </div>

<p-toast/>
<p-table 
    [value]="searches" 
    [tableStyle]="{ 'min-width': '50rem' }"
    [scrollable]="true"
    scrollHeight="calc(100vh - 10vh)"
    >
    <ng-template #header>
        <tr>
            <th>
                Suchaufträge
                <button pButton (click)="update()">
                    @if (isLoading) {
                        <p-progress-spinner
                            ariaLabel="loading"
                            [style]="{ width: '1rem', height: '1rem' }"
                        />
                    } @else {
                        <svg data-p-icon="replay"></svg>
                    }
                </button>
            </th>              
        </tr>
    </ng-template>
    <ng-template #body let-search>
        <tr>
            <td>
               <div class="search-cell">

                    <div class="search-info">
                        <span class="search-keyword">
                            {{ search.keyword }}
                        </span>

                        <span class="search-badge">
                            {{ search.postal_code }}
                        </span>

                        <span class="search-badge">
                            {{ search.radius }} km
                        </span>
                    </div>

                    <div class="search-portals">
                        <span>Portale:</span>
                        <span>StepStone</span>
                        <span>Commerzbank</span>
                        <span>Finanz Informatik</span>
                    </div>

                </div>
            </td>
        </tr>
    </ng-template>
</p-table>
    <div class="flex flex-col items-left " style="padding-top: 1rem;padding-left: 1rem;">
            <div class="flex flex-wrap p-4">
                <button (click)="show()" pButton class="flex-wrap">
                    <svg data-p-icon="plus-circle"></svg> 
                    Suche anlegen
                </button>
            </div>

     </div>
